<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Andrea Mounir</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #07070e; color: #fff; min-height: 100vh; overflow-x: hidden; position: relative; }

        .glow-bg { position: fixed; width: 400px; height: 400px; border-radius: 50%; filter: blur(160px); pointer-events: none; z-index: 0; }
        .glow-purple { background: rgba(168, 85, 247, 0.22); top: -80px; left: -80px; }
        .glow-blue { background: rgba(59, 130, 246, 0.18); bottom: -80px; right: -80px; }

        #login-screen { position: fixed; inset: 0; background: rgba(7, 7, 14, 0.95); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .login-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 40px; border-radius: 24px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #a855f7, #3b82f6); }
        .login-card h2 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .login-card h2 span { color: #a855f7; }
        .login-card p { color: #888; font-size: 14px; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; font-weight: 500; }
        .input-group input { width: 100%; padding: 14px 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; outline: none; font-size: 14px; transition: 0.3s; }
        .input-group input:focus { border-color: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.25); }

        .btn-glow { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 6px 25px rgba(168, 85, 247, 0.4); width: 100%; font-size: 15px; margin-top: 10px; }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168, 85, 247, 0.6); }

        #dashboard-content { display: none; padding: 40px 8%; z-index: 1; position: relative; max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 20px; flex-wrap: wrap; gap: 20px; }
        header h1 { font-size: 2rem; font-weight: 700; }
        header h1 span { color: #a855f7; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .admin-tag { background: rgba(168, 85, 247, 0.15); color: #a855f7; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1px solid rgba(168, 85, 247, 0.3); }

        .btn-logout { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 500; transition: 0.3s; font-size: 14px; }
        .btn-logout:hover { background: #ef4444; color: #fff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 24px; border-radius: 20px; display: flex; align-items: center; gap: 20px; backdrop-filter: blur(10px); }
        .stat-icon { width: 55px; height: 55px; border-radius: 16px; background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(59, 130, 246, 0.2)); color: #a855f7; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 1px solid rgba(168, 85, 247, 0.3); }
        .stat-info h3 { font-size: 26px; font-weight: 700; }
        .stat-info p { font-size: 13px; color: #888; }

        .section-title { font-size: 1.4rem; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: #a855f7; }

        .messages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; }
        .msg-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 25px; position: relative; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; backdrop-filter: blur(10px); }
        .msg-card:hover { transform: translateY(-5px); border-color: rgba(168, 85, 247, 0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .msg-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .msg-user h4 { font-size: 17px; color: #fff; font-weight: 600; }
        .msg-user p { font-size: 13px; color: #a855f7; word-break: break-all; }
        .msg-date { font-size: 11px; color: #666; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 10px; }
        .msg-body { font-size: 14px; color: #ccc; line-height: 1.6; margin-bottom: 20px; background: rgba(0,0,0,0.25); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.03); white-space: pre-wrap; word-break: break-word; }
        .msg-actions { display: flex; gap: 12px; justify-content: flex-end; }
        
        .btn-action { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #aaa; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: 0.2s; text-decoration: none; }
        .btn-action.reply:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        .btn-action.delete:hover { background: #ef4444; color: #fff; border-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }

        .empty-state { text-align: center; padding: 60px 20px; grid-column: 1 / -1; color: #666; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; color: rgba(168, 85, 247, 0.3); }
    </style>
</head>
<body>

    <div class="glow-bg glow-purple"></div>
    <div class="glow-bg glow-blue"></div>

    <div id="login-screen">
        <div class="login-card">
            <h2>Admin <span>Panel</span></h2>
            <p>Welcome back, Andrea! Please authenticate.</p>
            <form id="login-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="admin-email" placeholder="Enter your email" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="admin-password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-glow" id="btn-login">Access Dashboard <i class="fas fa-arrow-right" style="margin-left: 8px;"></i></button>
            </form>
        </div>
    </div>

    <div id="dashboard-content">
        <header>
            <h1>Admin <span>Dashboard</span></h1>
            <div class="header-actions">
                <span class="admin-tag"><i class="fas fa-shield-alt"></i> Andrea Mounir</span>
                <button class="btn-logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-inbox"></i></div>
                <div class="stat-info">
                    <h3 id="total-messages">0</h3>
                    <p>Total Received Messages</p>
                </div>
            </div>
        </div>

        <h2 class="section-title"><i class="fas fa-paper-plane"></i> Inbox Messages</h2>
        <div class="messages-grid" id="messages-container"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBvWCnHac6f4fgexw-VLUWGf1hVTey6fZE",
            authDomain: "andria-mounir.firebaseapp.com",
            projectId: "andria-mounir",
            storageBucket: "andria-mounir.firebasestorage.app",
            messagingSenderId: "910584096570",
            appId: "1:910584096570:web:dc3188b170a280bab1d203",
            measurementId: "G-QVLQL3NKS4"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const loginScreen = document.getElementById('login-screen');
        const dashboardContent = document.getElementById('dashboard-content');
        const loginForm = document.getElementById('login-form');
        const messagesContainer = document.getElementById('messages-container');
        const totalMessagesElement = document.getElementById('total-messages');
        const btnLogin = document.getElementById('btn-login');

        let unsubscribeMessages = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                loginScreen.style.display = 'none';
                dashboardContent.style.display = 'block';
                loadMessages();
            } else {
                loginScreen.style.display = 'flex';
                dashboardContent.style.display = 'none';
                messagesContainer.innerHTML = '';
                if (unsubscribeMessages) unsubscribeMessages();
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('admin-email').value.trim();
            const passwordInput = document.getElementById('admin-password').value.trim();

            btnLogin.innerText = "Authenticating...";

            auth.signInWithEmailAndPassword(emailInput, passwordInput)
                .then(() => {
                    btnLogin.innerHTML = `Access Dashboard <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>`;
                })
                .catch((error) => {
                    alert("Access Denied: " + error.message);
                    btnLogin.innerHTML = `Access Dashboard <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>`;
                });
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut();
        });

        function loadMessages() {
            unsubscribeMessages = db.collection("messages").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                messagesContainer.innerHTML = '';
                totalMessagesElement.textContent = snapshot.docs.length;

                if (snapshot.empty) {
                    messagesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="far fa-folder-open"></i>
                            <p>No messages received yet.</p>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString() : 'Just now';

                    const card = document.createElement('div');
                    card.className = 'msg-card';
                    card.innerHTML = `
                        <div>
                            <div class="msg-header">
                                <div class="msg-user">
                                    <h4>${escapeHtml(data.name)}</h4>
                                    <p>${escapeHtml(data.email)}</p>
                                </div>
                                <span class="msg-date">${date}</span>
                            </div>
                            <div class="msg-body">${escapeHtml(data.message)}</div>
                        </div>
                        <div class="msg-actions">
                            <a href="mailto:${escapeHtml(data.email)}" class="btn-action reply" title="Reply via Email"><i class="fas fa-reply"></i></a>
                            <button class="btn-action delete" onclick="deleteMessage('${doc.id}')" title="Delete Message"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    `;
                    messagesContainer.appendChild(card);
                });
            }, (error) => {
                console.error("Error fetching messages: ", error);
                alert("Permission Denied: Unauthorized access.");
            });
        }

        function deleteMessage(id) {
            if (confirm("Are you sure you want to delete this message permanently?")) {
                db.collection("messages").doc(id).delete()
                    .catch((error) => {
                        console.error("Error removing document: ", error);
                        alert("Delete failed: Insufficient permissions.");
                    });
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
